<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Testing Page</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.10.3/babel.min.js" crossorigin></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,stage-3">

        const Main = () => {
          return (
            <div className="container mt-4">
              <h6 className="mb-4">React Testing Page</h6>
              <form>
                <TextInput />
                <NumericInput />
                <Dropdown />
                <ButtonDropdown />
                <RadioButtons />
                <Checkboxes />
                <FileUpload />
                <DateTimePicker />
                <RangeSlider />
                <TextArea />
                <SubmitButton />
              </form>
            </div>
          );
        };

        const TextInput = () => (
          <div className="mb-3" id="text-input">
            <label htmlFor="textInput" className="form-label">Text Input</label>
            <input type="text" className="form-control" id="textInput" placeholder="Enter some text" />
          </div>
        );

        const NumericInput = () => (
          <div className="mb-3" id="numeric-input">
            <label htmlFor="numberInput" className="form-label">Numeric Input</label>
            <input type="number" className="form-control" id="numberInput" placeholder="Enter a number" />
          </div>
        );

        const Dropdown = () => (
          <div className="mb-3" id="basic-dropdown">
            <label htmlFor="dropdown" className="form-label">Dropdown</label>
            <select className="form-select" id="dropdown">
              <option value="">Choose an option</option>
              <option value="1">Option 1</option>
              <option value="2">Option 2</option>
              <option value="3">Option 3</option>
            </select>
          </div>
        );

        const ButtonDropdown = () => {
        const [selectedAction, setSelectedAction] = React.useState("Choose Action");

        const handleActionClick = (action) => {
          setSelectedAction(action); // Update the selected action
        };

        return (
          <div className="mb-3" id="button-dropdown">
            <label className="form-label">Dropdown of Buttons</label>
            <div className="dropdown">
              <button
                className="btn btn-secondary dropdown-toggle"
                type="button"
                id="dropdownMenuButton"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                {selectedAction} {/* Display the selected action */}
              </button>
              <ul className="dropdown-menu" aria-labelledby="dropdownMenuButton">
                <li>
                  <button
                    className="dropdown-item"
                    type="button"
                    onClick={() => handleActionClick("Action 1")}
                  >
                    Action 1
                  </button>
                </li>
                <li>
                  <button
                    className="dropdown-item"
                    type="button"
                    onClick={() => handleActionClick("Action 2")}
                  >
                    Action 2
                  </button>
                </li>
                <li>
                  <button
                    className="dropdown-item"
                    type="button"
                    onClick={() => handleActionClick("Action 3")}
                  >
                    Action 3
                  </button>
                </li>
              </ul>
            </div>
          </div>
        );
      };


        const RadioButtons = () => (
          <div className="mb-3" id="radio-buttons">
            <label className="form-label">Radio Buttons</label>
            <div>
              <div className="form-check">
                <input className="form-check-input" type="radio" name="options" id="option1" />
                <label className="form-check-label" htmlFor="option1">Option 1</label>
              </div>
              <div className="form-check">
                <input className="form-check-input" type="radio" name="options" id="option2" />
                <label className="form-check-label" htmlFor="option2">Option 2</label>
              </div>
              <div className="form-check">
                <input className="form-check-input" type="radio" name="options" id="option3" />
                <label className="form-check-label" htmlFor="option3">Option 3</label>
              </div>
            </div>
          </div>
        );

        const Checkboxes = () => (
          <div className="mb-3" id="checkboxes">
            <label className="form-label">Checkboxes</label>
            <div>
              <div className="form-check">
                <input className="form-check-input" type="checkbox" id="check1" />
                <label className="form-check-label" htmlFor="check1">Checkbox 1</label>
              </div>
              <div className="form-check">
                <input className="form-check-input" type="checkbox" id="check2" />
                <label className="form-check-label" htmlFor="check2">Checkbox 2</label>
              </div>
            </div>
          </div>
        );

        const FileUpload = () => (
          <div className="mb-3" id="file-upload">
            <label htmlFor="fileInput" className="form-label">File Upload</label>
            <input className="form-control" type="file" id="fileInput" />
          </div>
        );

        const DateTimePicker = () => (
          <div className="mb-3" id="datetime-picker">
            <label htmlFor="dateTimeInput" className="form-label">Date and Time Picker</label>
            <input type="datetime-local" className="form-control" id="dateTimeInput" />
          </div>
        );

        const RangeSlider = () => (
          <div className="mb-3" id="range-slider">
            <label htmlFor="rangeInput" className="form-label">Range Slider</label>
            <input type="range" className="form-range" id="rangeInput" min="0" max="100" />
          </div>
        );

        const TextArea = () => (
          <div className="mb-3" id="text-area">
            <label htmlFor="textArea" className="form-label">Text Area</label>
            <textarea className="form-control" id="textArea" rows="3" placeholder="Enter more detailed information"></textarea>
          </div>
        );

        const SubmitButton = () => (
          <div className="mb-3" id="submit-button">
            <button type="submit" className="btn btn-primary">Submit</button>
          </div>
        );

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<Main />);
    </script>
</body>

</html>
