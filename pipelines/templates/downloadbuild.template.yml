#downloadbuild.template.yml
parameters:
- name: projectName
  type: string
  default: 'HitachiQA'
- name: definitionId
  type: string
  default: '94'



steps:
- task: PowerShell@2
  displayName: 'Get Build Id'
  inputs:
    targetType: 'inline'
    script: |
      $personalAccessToken = "$(System.AccessToken)"
      $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(("{0}:{1}" -f "",$personalAccessToken)))
      $buildsUrl = "https://dev.azure.com/tfs-hisol-crm/${{parameters.projectName}}/_apis/build/builds?definitions=${{parameters.definitionId}}&api-version=7.0"
      Write-Host "requested Uri: $buildsUrl"
      $builds = (Invoke-RestMethod -Uri $buildsUrl -Headers @{Authorization=("Basic {0}" -f $base64AuthInfo)}).value
      $filteredBuilds = $builds | Where-Object { ($_.sourceVersion -eq "$(Build.SourceVersion)") -and ($_.result -eq 'succeeded') }
      $buildId = $filteredBuilds[0].id
      Write-Host "##vso[task.setvariable variable=buildId]$buildId"
      Write-Host "result buildId: $buildId"
      exit 0
      
- task: DownloadBuildArtifacts@1
  displayName: 'Download artifact'
  inputs:
    buildType: 'specific'
    project: '61625407-898a-434e-8afd-d63c0ae44cfa'
    pipeline: $(definitionId)
    specificBuildWithTriggering: true
    buildVersionToDownload: specific
    buildId: $(buildId)
    branchName: '$(Build.SourceBranch)'
    downloadType: 'single'
    artifactName: 'drop'
    downloadPath: '$(System.DefaultWorkingDirectory)'

- task: ExtractFiles@1
  displayName: 'Extract files from zip'
  inputs:
    archiveFilePatterns: '**/HitachiQA.zip'
    destinationFolder: '$(System.DefaultWorkingDirectory)/HitachiQA'
- task: ExtractFiles@1
  displayName: 'Extract files from zip'
  inputs:
    archiveFilePatterns: '**/Hsl.HitachiQA.Builder.zip'
    destinationFolder: '$(System.DefaultWorkingDirectory)/Hsl.HitachiQA.Builder'