parameters:
- name: filter
  type: string
  default: 'TestCategory!=dynamics.fo&TestCategory!=dynamics.fs'
- name: runTitle
  type: string
  default: 'HitachiQA Unit Tests'
- name: runsettings
  type: string
  default: default.runsettings


steps:
#file transform consumes env variables and replaces them in appsettings.json (they must exist in appsettings.json)
- bash: |
    echo "##vso[task.setvariable variable=OPTIONS;]--headless;--window-size=1800,1200"
    echo "##vso[task.setvariable variable=Playwright.Headless;]true"

- task: DotNetCoreCLI@2
  displayName: "Build Unit Tests"
  inputs:
    command: "build"
    arguments: '--configuration Release'
    projects: "**/HitachiQA.UnitTests.csproj"

- task: FileTransform@2
  inputs:
    folderPath: '$(System.DefaultWorkingDirectory)/HitachiQA.UnitTests/bin/Release/net8.0/'
    jsonTargetFiles: 'appsettings.json'
    xmlTransformationRules: ''

- task: VsTest@3
  displayName: "Unit Tests"
  inputs:
    testSelector: 'testAssemblies'
    testAssemblyVer2: '**/bin/**/HitachiQA.UnitTests.dll'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    runSettingsFile: '$(System.DefaultWorkingDirectory)/HitachiQA.UnitTests/${{ parameters.runsettings }}'
    runInParallel: true
    rerunFailedTests: true
    rerunMaxAttempts: 3
    rerunFailedThreshold: 5
    rerunTestCasesMaxLimit: 50
    otherConsoleOptions: '/TestCaseFilter:${{ parameters.filter }}'
    testRunTitle: $(runTitle)

