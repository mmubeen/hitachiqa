parameters:
- name: filter
  type: string
  default: 'TestCategory!=dynamics.fo&TestCategory!=dynamics.fs'
- name: runTitle
  type: string
  default: 'HitachiQA Unit Tests'
- name: runsettings
  type: string
  default: default.runsettings


steps:
#file transform consumes env variables and replaces them in appsettings.json (they must exist in appsettings.json)
- bash: |
    echo "##vso[task.setvariable variable=OPTIONS;]--headless"

- task: FileTransform@1
  inputs:
    folderPath: '$(System.DefaultWorkingDirectory)/HitachiQA.UnitTests/bin/Release/net6.0'
    fileType: 'json'

- pwsh: '$(System.DefaultWorkingDirectory)/HitachiQA.UnitTests/bin/Release/net6.0/playwright.ps1 install --with-deps'

- task: DotNetCoreCLI@2
  displayName: "Unit Tests"
  inputs:
    command: 'test'
    projects: '**/HitachiQA.UnitTests.dll'
    arguments: '--settings $(System.DefaultWorkingDirectory)/HitachiQA.UnitTests/${{parameters.runsettings}} --no-build --filter ${{parameters.filter}}'
    testRunTitle: ${{ parameters.runTitle }}