#build.template.yml
parameters: 
- name: buildConfiguration
  type: string
  default: 'Release'


steps:
- task: UseDotNet@2
  displayName: 'Install .NET 6 SDK'
  inputs:
    version: '6.0.x'

- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    version: '8.0.x'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    arguments: '--configuration $(buildConfiguration) --output $(Build.BinariesDirectory)/HitachiQA'
    projects: '**/HitachiQA.csproj'
  displayName: 'build HitachiQA $(buildConfiguration)'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    arguments: '--configuration $(buildConfiguration) --output $(Build.BinariesDirectory)/Hsl.HitachiQA.Builder'
    projects: '**/Hsl.HitachiQA.Builder.csproj'
  displayName: 'build Hsl.HitachiQA.Builder $(buildConfiguration)'

- task: ArchiveFiles@2
  displayName: "zip HitachiQA"
  inputs:
    rootFolderOrFile: '$(Build.BinariesDirectory)/HitachiQA'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/HitachiQA.zip'

- task: ArchiveFiles@2
  displayName: "zip Hsl.HitachiQA.Builder bin"
  inputs:
    rootFolderOrFile: '$(Build.BinariesDirectory)/Hsl.HitachiQA.Builder'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/Hsl.HitachiQA.Builder.zip'

