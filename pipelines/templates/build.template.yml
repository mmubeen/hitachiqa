#build.template.yml
parameters: 
- name: buildConfiguration
  type: string
  default: 'Release'
# - name: solution
#   type: string
#   default: '**/*.sln'
- name: project
  type: string
  default: '**/*.csproj'


steps:
- task: UseDotNet@2
  inputs:
    version: 6.0.x

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    arguments: '--configuration ${{parameters.buildConfiguration}}'
    projects: '${{parameters.project}}'
  displayName: 'dotnet build ${{parameters.buildConfiguration}}'

