# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4

trigger:
  branches:
    include:
    - master
  paths:
    exclude:
    - '*.yml'
    
pool:
  vmImage: 'ubuntu-latest'

variables:
  solution: '**/*.sln'
  project: '**/*.csproj'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

stages:
  - stage: Build
    jobs:
    - job: Build
      pool:
        vmImage: 'ubuntu-latest'
      displayName: 'Build job'
      steps:
        # The first task is the dotnet command build, pointing to our csproj file
        - task: UseDotNet@2
          inputs:
            version: 6.0.x

        - task: DotNetCoreCLI@2
          inputs:
            command: 'build'
            arguments: '--configuration $(buildConfiguration)'
            projects: '$(project)'
          displayName: 'dotnet build $(buildConfiguration)'
        
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(System.DefaultWorkingDirectory)'
            artifactName: drop
    - job: Test
      dependsOn: Build
      pool:
        vmImage: 'windows-latest'
      steps:
      - checkout: none
      - task: DownloadBuildArtifacts@0
        inputs:
          buildType: 'current'
          downloadType: 'single'
          artifactName: 'drop'
          downloadPath: '$(System.DefaultWorkingDirectory)'
      - task: DotNetCoreCLI@2
        displayName: "Unit Tests"
        inputs:
          command: 'test'
          projects: '**/HitachiQA.UnitTests.dll'
          arguments: '--settings $(System.DefaultWorkingDirectory)/drop/HitachiQA.UnitTests/default.runsettings --no-build --filter TestCategory!=Dynamics'
          testRunTitle: 'HitachiQA Unit Tests'

    - job: publishNugetFiles
      dependsOn: Test
      pool:
        vmImage: 'ubuntu-latest'
      steps:
      - checkout: none
      - task: UseDotNet@2
        inputs:
          version: 6.0.x
      - task: DotNetCoreCLI@2
        inputs:
          command: 'build'
          arguments: '--configuration $(buildConfiguration)'
          projects: '$(project)'
        displayName: 'dotnet build $(buildConfiguration)'
        
      - task: DotNetCoreCLI@2
        displayName: 'pack'
        inputs:
          command: 'pack'
          projects: '$(solution)'
          searchPatternPack: '$(project)'
          nobuild: true
          outputDir: '$(System.DefaultWorkingDirectory)/PackOutput'
          versioningScheme: 'byPrereleaseNumber'
          majorVersion: '1'
          
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: '$(System.DefaultWorkingDirectory)/PackOutput'
          artifactName: drop

     